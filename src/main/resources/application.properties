spring.application.name=comunications

# Datasource defaults. In Azure App Service these are overridden with
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://proyecto-integrador.mysql.database.azure.com:3306/motos_del_caribe?useSSL=true&requireSSL=true&verifyServerCertificate=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Bogota}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:Sebastian}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Good9251}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fix response/request encoding to avoid broken accents in JSON.
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

spring.jackson.time-zone=America/Bogota

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
